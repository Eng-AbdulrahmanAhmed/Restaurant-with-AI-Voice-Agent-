<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .o { fill: #FFF7ED; stroke: #F97316; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .l { fill: none; stroke: #F97316; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .d { fill: #F97316; stroke: none; }
    </style>

    <g id="burger">
      <path class="o" d="M-32,-4 C-32,-30 -16,-36 0,-36 C16,-36 32,-30 32,-4 Z"/>
      <ellipse class="l" cx="-14" cy="-22" rx="3" ry="1.6" transform="rotate(-20 -14 -22)"/>
      <ellipse class="l" cx="0" cy="-27" rx="3" ry="1.6"/>
      <ellipse class="l" cx="14" cy="-21" rx="3" ry="1.6" transform="rotate(20 14 -21)"/>
      <path class="o" d="M-36,-2 q6,9 12,0 q6,9 12,0 q6,9 12,0 q6,9 12,0 q6,9 12,0 q6,9 12,0 V6 H-36 Z"/>
      <rect class="o" x="-33" y="8" width="66" height="11" rx="5.5"/>
      <path class="o" d="M-32,23 H32 C32,32 26,36 18,36 H-18 C-26,36 -32,32 -32,23 Z"/>
    </g>

    <g id="cola">
      <path class="l" d="M4,-22 V-40 L18,-47"/>
      <path class="o" d="M-16,-14 L16,-14 L12,34 L-12,34 Z"/>
      <rect class="o" x="-20" y="-23" width="40" height="9" rx="4"/>
      <path class="l" d="M-14,4 q3.5,-6 7,0 t7,0 t7,0 t7,0"/>
      <circle class="l" cx="0" cy="18" r="5"/>
    </g>

    <g id="fries">
      <path class="o" d="M-12,0 V-28 H-6 V0 Z"/>
      <path class="o" d="M-3,0 V-38 H3 V0 Z"/>
      <path class="o" d="M6,0 V-32 H12 V0 Z"/>
      <path class="o" d="M-19,0 V-18 H-13 V0 Z"/>
      <path class="o" d="M13,0 V-22 H19 V0 Z"/>
      <path class="o" d="M-22,0 L22,0 L16,38 L-16,38 Z"/>
      <path class="l" d="M-14,16 l5,7 l5,-7 l5,7 l5,-7 l5,7 l5,-7"/>
    </g>

    <g id="spark">
      <path class="l" d="M0,-7 V7 M-7,0 H7"/>
    </g>

    <pattern id="tile" width="400" height="400" patternUnits="userSpaceOnUse">
      <rect width="400" height="400" fill="#FFF7ED"/>

      <use href="#burger" transform="translate(65,68) rotate(-12)"/>
      <use href="#cola"   transform="translate(195,62) rotate(10)"/>
      <use href="#fries"  transform="translate(325,78) rotate(-8)"/>

      <use href="#cola"   transform="translate(65,205) rotate(-10)"/>
      <use href="#fries"  transform="translate(195,198) rotate(12)"/>
      <use href="#burger" transform="translate(325,205) rotate(8)"/>

      <use href="#fries"  transform="translate(65,330) rotate(8)"/>
      <use href="#burger" transform="translate(195,338) rotate(-10)"/>
      <use href="#cola"   transform="translate(325,326) rotate(14)"/>

      <use href="#spark" transform="translate(130,135)"/>
      <use href="#spark" transform="translate(262,138) rotate(45)"/>
      <use href="#spark" transform="translate(130,268) rotate(45)"/>
      <use href="#spark" transform="translate(262,270)"/>
      <use href="#spark" transform="translate(385,15) rotate(45)"/>
      <circle class="d" cx="15" cy="140" r="3"/>
      <circle class="d" cx="385" cy="140" r="3"/>
      <circle class="d" cx="15" cy="270" r="3"/>
      <circle class="d" cx="385" cy="270" r="3"/>
      <circle class="d" cx="130" cy="15" r="3"/>
      <circle class="d" cx="262" cy="15" r="3"/>
      <circle class="d" cx="130" cy="392" r="3"/>
      <circle class="d" cx="262" cy="392" r="3"/>
    </pattern>
  </defs>

  <rect width="800" height="800" fill="url(#tile)"/>
</svg>
